name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-latest
          - name: macOS Apple Silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet -p=1 ./...
      - name: Test
        run: GOMAXPROCS=2 go test -race -p=1 ./...
      - name: Check shell scripts
        run: sh -n install.sh && sh -n scripts/release.sh
      - name: Build and smoke native release-style binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o codator .
          ./codator --help
      - name: Build release assets
        if: matrix.runner == 'ubuntu-latest'
        run: scripts/release.sh
      - name: Verify release assets
        if: matrix.runner == 'ubuntu-latest'
        run: |
          ./dist/codator-linux-amd64 --help
          (cd dist && sha256sum -c SHA256SUMS)
