name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-latest
          - name: macOS Apple Silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet -p=1 ./...
      - name: Test
        run: GOMAXPROCS=2 go test -race -p=1 ./...
      - name: Check shell scripts
        run: sh -n install.sh && sh -n scripts/cdx && sh -n scripts/cdl && sh -n scripts/release.sh
      - name: Build and smoke native release-style binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o codator .
          ./codator --help
      - name: Build release assets
        if: matrix.runner == 'ubuntu-latest'
        run: scripts/release.sh
      - name: Verify release assets
        if: matrix.runner == 'ubuntu-latest'
        run: |
          ./dist/codator-linux-amd64 --help
          (cd dist && sha256sum -c SHA256SUMS)

  govulncheck:
    name: govulncheck (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            goos: linux
            goarch: amd64
          - name: Linux arm64
            goos: linux
            goarch: arm64
          - name: Darwin amd64
            goos: darwin
            goarch: amd64
          - name: Darwin arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Scan release target
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
