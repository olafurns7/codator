name: Release

on:
  workflow_dispatch:
    inputs:
      checksums_sha256:
        description: SHA-256 of the locally generated SHA256SUMS manifest
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_REPO: "olafurns7/codator"
      GH_TOKEN: "${{ github.token }}"
      RELEASE_REF: "${{ github.ref }}"
      RELEASE_REF_TYPE: "${{ github.ref_type }}"
      RELEASE_TAG: "${{ github.ref_name }}"
      CHECKSUMS_SHA256: "${{ inputs.checksums_sha256 }}"
    steps:
      - name: Validate tag, checksum, and draft release
        shell: sh
        env:
          RELEASE_ROOT: "${{ runner.temp }}/codator-release"
          RELEASE_PACKAGE_DIR: "${{ runner.temp }}/codator-release/package"
        run: |
          set -eu
          fail() {
            printf '%s\n' "release signing: $*" >&2
            exit 1
          }

          for command in awk gh jq mkdir mktemp sha256sum tr wc; do
            command -v "$command" >/dev/null 2>&1 || fail "required command not found: $command"
          done

          [ "$RELEASE_REF_TYPE" = tag ] || fail "workflow must run from a tag"
          [ "$RELEASE_REF" = "refs/tags/$RELEASE_TAG" ] || fail "workflow ref is not the matching tag ref"
          if ! printf '%s\n' "$RELEASE_TAG" | awk -F. '
            NF != 3 ||
            $1 !~ /^v[0-9][0-9]*$/ ||
            $2 !~ /^[0-9][0-9]*$/ ||
            $3 !~ /^[0-9][0-9]*$/ { exit 1 }
          '; then
            fail "release tag must be a conservative vMAJOR.MINOR.PATCH tag"
          fi
          checksum_length=$(printf '%s' "$CHECKSUMS_SHA256" | wc -c)
          [ "$checksum_length" -eq 64 ] || fail "checksums_sha256 must be exactly 64 hexadecimal characters"
          case "$CHECKSUMS_SHA256" in
            ''|*[!0-9A-Fa-f]*) fail "checksums_sha256 must be exactly 64 hexadecimal characters" ;;
          esac

          [ ! -e "$RELEASE_ROOT" ] || fail "release temporary directory already exists"
          mkdir -m 700 "$RELEASE_ROOT"
          mkdir -m 700 "$RELEASE_PACKAGE_DIR"

          release_json=$(mktemp "$RELEASE_ROOT/release.XXXXXX.json")
          gh release view "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --json databaseId,isDraft,tagName > "$release_json"
          [ "$(jq -r '.tagName' "$release_json")" = "$RELEASE_TAG" ] || fail "release tag does not match workflow tag"
          [ -n "$(jq -r '.databaseId // empty' "$release_json")" ] || fail "matching release has no database id"
          [ "$(jq -r '.isDraft' "$release_json")" = true ] || fail "matching release is not still a draft"

      - name: Download the signed-manifest subject
        shell: sh
        env:
          RELEASE_ROOT: "${{ runner.temp }}/codator-release"
          RELEASE_PACKAGE_DIR: "${{ runner.temp }}/codator-release/package"
        run: |
          set -eu
          fail() {
            printf '%s\n' "release signing: $*" >&2
            exit 1
          }

          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --dir "$RELEASE_PACKAGE_DIR" \
            --pattern SHA256SUMS
          [ -s "$RELEASE_PACKAGE_DIR/SHA256SUMS" ] || fail "draft release did not provide SHA256SUMS"
          actual=$(sha256sum "$RELEASE_PACKAGE_DIR/SHA256SUMS" | awk '{ print $1 }')
          expected=$(printf '%s\n' "$CHECKSUMS_SHA256" | tr '[:upper:]' '[:lower:]')
          [ "$actual" = "$expected" ] || fail "downloaded SHA256SUMS does not match checksums_sha256"

      - name: Attest the signed manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          RELEASE_PACKAGE_DIR: "${{ runner.temp }}/codator-release/package"
        with:
          subject-path: "${{ env.RELEASE_PACKAGE_DIR }}/SHA256SUMS"

      - name: Upload only the attestation bundle to the draft release
        shell: sh
        env:
          BUNDLE_PATH: "${{ steps.attest.outputs.bundle-path }}"
          RELEASE_ROOT: "${{ runner.temp }}/codator-release"
          RELEASE_PACKAGE_DIR: "${{ runner.temp }}/codator-release/package"
        run: |
          set -eu
          fail() {
            printf '%s\n' "release signing: $*" >&2
            exit 1
          }

          [ -s "$BUNDLE_PATH" ] || fail "attestation bundle is missing or empty"
          cp -- "$BUNDLE_PATH" "$RELEASE_PACKAGE_DIR/attestations.jsonl"

          release_json=$(mktemp "$RELEASE_ROOT/upload-release.XXXXXX.json")
          gh release view "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --json databaseId,isDraft,tagName > "$release_json"
          [ "$(jq -r '.tagName' "$release_json")" = "$RELEASE_TAG" ] || fail "release tag changed before bundle upload"
          [ -n "$(jq -r '.databaseId // empty' "$release_json")" ] || fail "release has no database id before bundle upload"
          [ "$(jq -r '.isDraft' "$release_json")" = true ] || fail "release is no longer a draft; refusing bundle upload"

          gh release upload "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --clobber \
            "$RELEASE_PACKAGE_DIR/attestations.jsonl"
