name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build release assets
        run: scripts/release.sh
      - name: Verify release assets
        run: |
          ./dist/codator-linux-amd64 --help
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/codator-linux-amd64 dist/codator-linux-arm64 dist/codator-darwin-amd64 dist/codator-darwin-arm64 dist/LICENSE dist/SHA256SUMS --generate-notes --title "Codator $GITHUB_REF_NAME"
