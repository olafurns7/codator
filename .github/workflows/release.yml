name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet -p=1 ./...
      - name: Test
        run: GOMAXPROCS=2 go test -race -p=1 ./...
      - name: Check shell scripts
        run: sh -n install.sh && sh -n scripts/release.sh
      - name: Build release assets
        run: scripts/release.sh
      - name: Verify release assets
        run: |
          ./dist/codator-linux-amd64 --help
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/codator-linux-amd64 dist/codator-linux-arm64 dist/SHA256SUMS --generate-notes --title "Codator $GITHUB_REF_NAME"
